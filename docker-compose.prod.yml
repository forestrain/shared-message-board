# 生产环境：GCP VM 上一键部署
# 务必带 env 文件：docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 若本机 80 已被占用，默认映射 8080（见 .env.prod 中 HTTP_PORT）

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-board}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-board}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-board} -d ${POSTGRES_DB:-board}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - appnet

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-board}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-board}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sid}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env.prod}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1}
      UPLOAD_DIR: /data/uploads
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - appnet

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - uploads_data:/data/uploads:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - appnet

volumes:
  pgdata:
  uploads_data:

networks:
  appnet:
    driver: bridge
